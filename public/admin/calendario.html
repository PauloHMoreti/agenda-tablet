<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Calendário</title>
<style>
  :root {
    --ink: #1a1d1f;
    --paper: #fbfaf7;
    --line: #dcd8cf;
    --accent: #2f5d50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    padding: 32px 20px 80px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #6b6f66; font-size: 14px; }
  a.back { color: var(--accent); font-size: 13.5px; text-decoration: none; }

  .monthbar { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 20px 0; }
  .monthbar h2 { font-size: 18px; margin: 0; min-width: 200px; text-align: center; text-transform: capitalize; }
  .navbtn { border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 34px; height: 34px;
            font-size: 15px; cursor: pointer; }
  .navbtn:hover { background: #f2f0ea; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow { text-align: center; font-size: 11px; font-weight: 700; color: #8b8f83; text-transform: uppercase;
         letter-spacing: .04em; padding-bottom: 4px; }
  .day {
    background: #fff; border: 1px solid var(--line); border-radius: 10px; min-height: 74px;
    padding: 6px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
    text-decoration: none; color: var(--ink);
  }
  .day:hover { border-color: var(--accent); }
  .day.other-month { opacity: 0.35; }
  .day.today { border: 2px solid var(--accent); }
  .day .num { font-size: 13px; font-weight: 700; }
  .day .counts { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; }
  .pill { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 20px; }
  .pill.total { background: #eef0ea; color: #4a4f43; }
  .pill.atrasados { background: #a3241a; color: #fff; }
  .pill.concluidos { background: #e8efe9; color: #2f5d50; }

  .legend { display:flex; gap:14px; justify-content:center; margin-top:18px; font-size:12.5px; color:#6b6f66; flex-wrap: wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/admin/">← Voltar pro painel</a>
    <h1 style="margin-top:8px;">Calendário</h1>
    <div class="sub">Toque num dia pra abrir os blocos daquela data no painel.</div>
  </header>

  <div class="monthbar">
    <button class="navbtn" id="btnPrevMonth">◀</button>
    <h2 id="monthLabel"></h2>
    <button class="navbtn" id="btnNextMonth">▶</button>
  </div>

  <div class="grid" id="dowRow"></div>
  <div class="grid" id="calGrid" style="margin-top:6px;"></div>

  <div class="legend">
    <span><span class="dot" style="background:#eef0ea;border:1px solid #ccc;"></span> total de blocos</span>
    <span><span class="dot" style="background:#a3241a;"></span> atrasados</span>
    <span><span class="dot" style="background:#e8efe9;border:1px solid #bfe0c9;"></span> concluídos</span>
  </div>
</div>

<script>
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function todayStr() {
  const d = new Date();
  const tz = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return tz.toISOString().slice(0, 10);
}
function pad2(n) { return String(n).padStart(2, '0'); }

const urlParams = new URLSearchParams(window.location.search);
let current = urlParams.get('month') || todayStr().slice(0, 7); // "YYYY-MM"

const dowRow = document.getElementById('dowRow');
DOW.forEach(d => {
  const el = document.createElement('div');
  el.className = 'dow';
  el.textContent = d;
  dowRow.appendChild(el);
});

async function render() {
  const [year, month] = current.split('-').map(Number);
  document.getElementById('monthLabel').textContent = `${MESES[month - 1]} de ${year}`;

  const res = await fetch('/api/blocks/month?month=' + current);
  const summary = await res.json();

  const firstOfMonth = new Date(year, month - 1, 1);
  const startWeekday = firstOfMonth.getDay(); // 0=domingo
  const daysInMonth = new Date(year, month, 0).getDate();
  const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  const today = todayStr();

  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startWeekday + 1;
    let cellDate, displayNum, otherMonth = false;

    if (dayNum < 1) {
      displayNum = daysInPrevMonth + dayNum;
      const pm = month - 1 < 1 ? 12 : month - 1;
      const py = month - 1 < 1 ? year - 1 : year;
      cellDate = `${py}-${pad2(pm)}-${pad2(displayNum)}`;
      otherMonth = true;
    } else if (dayNum > daysInMonth) {
      displayNum = dayNum - daysInMonth;
      const nm = month + 1 > 12 ? 1 : month + 1;
      const ny = month + 1 > 12 ? year + 1 : year;
      cellDate = `${ny}-${pad2(nm)}-${pad2(displayNum)}`;
      otherMonth = true;
    } else {
      displayNum = dayNum;
      cellDate = `${year}-${pad2(month)}-${pad2(dayNum)}`;
    }

    const s = summary[cellDate];
    const a = document.createElement('a');
    a.href = `/admin/?date=${cellDate}`;
    a.className = 'day' + (otherMonth ? ' other-month' : '') + (cellDate === today ? ' today' : '');
    a.innerHTML = `
      <span class="num">${displayNum}</span>
      <div class="counts">
        ${s && s.total ? `<span class="pill total">${s.total}</span>` : ''}
        ${s && s.atrasados ? `<span class="pill atrasados">${s.atrasados} atrasado${s.atrasados > 1 ? 's' : ''}</span>` : ''}
        ${s && s.concluidos ? `<span class="pill concluidos">${s.concluidos} ok</span>` : ''}
      </div>
    `;
    grid.appendChild(a);
  }
}

document.getElementById('btnPrevMonth').addEventListener('click', () => {
  const [y, m] = current.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  current = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  render();
});
document.getElementById('btnNextMonth').addEventListener('click', () => {
  const [y, m] = current.split('-').map(Number);
  const d = new Date(y, m, 1);
  current = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  render();
});

render();
</script>
</body>
</html>
